syntax = "proto3";

package idle;

// 协议号用 `// @id N` 注释给，不放自定义 option ——
// 这样这份文件能被任何 protobuf 工具（含前端 protobuf.js）直接吃。
//
// 为什么这个 demo 用 protobuf 而不是 JSON：payload=protobuf 这条链路
// 之前只有 tests/proto-test 的单元验证，没在"真实服务 + 真实客户端"里跑过。
// demo 的价值之一就是把它跑通。
//
// 两条生成器规则（不测就不知道）：
//   1. **每个 message 都要 @id**，包括只被 repeated 引用的嵌套类型（如 RankItem）
//   2. **不允许空 message**，无参数的请求也要放一个占位字段


// ---------- 登录 ----------

// @id 3001
message LoginReq {
  string name = 1;          // 重连时用同一个 name 复用角色
}

// @id 3002
message LoginResp {
  int32 uid = 1;
  string name = 2;
  int64 coins = 3;          // 当前金币
  int64 pending = 4;        // 待收取（按离线时长现算）
  int32 rate_per_minute = 5;
  int32 cap_seconds = 6;    // 收益上限（秒），让客户端能显示"已满"
}

// ---------- 收取 ----------

// @id 3003
message CollectReq {
  int32 seq = 1;            // 空 message 生成器不接受，占位（客户端填 0 即可）
}

// @id 3004
message CollectResp {
  int64 collected = 1;
  int64 coins = 2;
  int64 pending = 3;        // 收完之后还剩多少（不足一个结算周期的零头）
}

// ---------- 排行榜 ----------

// @id 3005
message RankReq {
  int32 top = 1;            // 客户端想要前几名
}

// @id 3006
message RankResp {
  repeated RankItem items = 1;
}

// @id 3101
message RankItem {
  int32 uid = 1;
  string name = 2;
  int64 coins = 3;
}

// ---------- 邮件 ----------

// @id 3007
message MailListReq {
  int32 seq = 1;
}

// @id 3008
message MailListResp {
  repeated MailInfo mails = 1;
}

// @id 3102
message MailInfo {
  int32 id = 1;
  string title = 2;
  bool read = 3;
  bool claimed = 4;
  bool has_items = 5;
}

// @id 3009
message MailClaimReq {
  int32 mail_id = 1;
}

// @id 3010
message MailClaimResp {
  bool ok = 1;
  repeated Item items = 2;
  int64 coins = 3;          // 领完之后的金币（附件里如果有金币）
}

// @id 3103
message Item {
  int32 id = 1;
  int32 n = 2;
}

// ---------- 错误 ----------

// @id 3011
message ErrorMsg {
  int32 code = 1;
  string msg = 2;
}
