name: fixture-v2
wasm: component
wasm-mode: library
# package/world 必须与宿主桥接层写死的 IFACE（typephp:s1-probe/api@1.0.0）一致，
# 否则 tp_open 直接返回 -1，而且不会告诉你为什么
wasm-package: typephp:s1-probe@1.0.0
wasm-world: s1-probe
# phpx 的 wasm 头用了 std::abort / std::fill 却没 include，
# clang 22+ 不再间接包含（旧版 libc++ 恰好包着，所以以前能过）
cxx-flags: |
  -include cstdlib
  -include algorithm
sources:
  - lib.php
