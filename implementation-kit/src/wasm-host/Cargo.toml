[package]
name = "tp-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "tp_host"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "tp-precompile"
path = "src/bin/precompile.rs"

[dependencies]
wasmtime = { version = "47", features = ["component-model"] }
wasmtime-wasi = "47"
wasmtime-wasi-http = "47"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"
codegen-units = 1
